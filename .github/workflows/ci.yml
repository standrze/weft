name: Swift platform validation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      # Install the requested swift.org toolchain independently of the runner's Xcode default.
      - uses: compnerd/gha-setup-swift@775d3f4111c5be58a0f62f2efdd353bb8fac15c7
        with:
          swift-version: swift-6.4.1-release
          swift-build: 6.4.1-RELEASE
      - name: Check toolchain
        run: |
          swift --version
          swift --version | python3 -c 'import re,sys; assert re.search(r"Swift version 6\.4\.1\b", sys.stdin.read()), "Swift 6.4.1 is required"'
      - name: Format, test, and build (sequential)
        run: |
          scripts/check-format.sh
          swift test
          swift build --product weft-demo
      - name: macOS PTY smoke
        run: |
          python3 scripts/smoke.py .build/debug/weft-demo
          python3 scripts/smoke.py .build/debug/weft-demo 150
          python3 scripts/smoke-features.py .build/debug/weft-demo
          python3 scripts/smoke-job-control.py .build/debug/weft-demo
  linux:
    runs-on: ubuntu-24.04
    container: swift:6.4.1-noble
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        locale: [C, C.UTF-8]
    env:
      LANG: ${{ matrix.locale }}
      LC_ALL: ${{ matrix.locale }}
    steps:
      - uses: actions/checkout@v4
      - name: Install PTY smoke runtime
        run: apt-get update && apt-get install -y --no-install-recommends python3
      - name: Format, test, and build (sequential)
        run: |
          swift --version
          swift --version | python3 -c 'import re,sys; assert re.search(r"Swift version 6\.4\.1\b", sys.stdin.read()), "Swift 6.4.1 is required"'
          scripts/check-format.sh
          swift test
          swift build --product weft-demo
      - name: Linux PTY smoke
        run: |
          python3 scripts/smoke.py .build/debug/weft-demo
          python3 scripts/smoke.py .build/debug/weft-demo 150
          python3 scripts/smoke-features.py .build/debug/weft-demo
          python3 scripts/smoke-job-control.py .build/debug/weft-demo
  windows:
    runs-on: windows-2025
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: compnerd/gha-setup-swift@775d3f4111c5be58a0f62f2efdd353bb8fac15c7
        with:
          swift-version: swift-6.4.1-release
          swift-build: 6.4.1-RELEASE
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Check toolchain
        run: |
          $version = swift --version | Out-String
          Write-Output $version
          if ($LASTEXITCODE -ne 0 -or $version -notmatch 'Swift version 6\.4\.1\b') { throw 'Swift 6.4.1 is required' }
      - name: Test and build (sequential)
        run: |
          swift test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          swift build --product weft-demo
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Windows private-console native smoke
        run: ./scripts/smoke-windows.ps1
